<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>올인원 스마트 계산기 - 계산 · 실시간 환율 · 단위변환</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <!-- 상단 헤더 & 탭 네비게이션 -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">∑</div>
        <div>
          <h1>스마트 올인원 계산기</h1>
          <p class="subtitle">일반/공학 계산 · 실시간 환율 · 다기능 단위변환</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggleBtn" class="icon-btn" title="테마 변경 (다크/라이트)">🌙</button>
      </div>
    </header>

    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="calculator">
        <span class="tab-icon">🧮</span> 계산기
      </button>
      <button class="tab-btn" data-tab="currency">
        <span class="tab-icon">💱</span> 실시간 환율
      </button>
      <button class="tab-btn" data-tab="unit">
        <span class="tab-icon">📏</span> 단위 변환
      </button>
    </nav>

    <!-- 1. 계산기 탭 -->
    <main id="tab-calculator" class="tab-panel active">
      <div class="calc-layout">
        <section class="calc-main">
          <div class="calc-mode-bar">
            <label class="toggle-switch">
              <input type="checkbox" id="sciModeToggle" />
              <span class="slider"></span>
              <span class="toggle-label">공학용 함수 보기</span>
            </label>
            <div class="angle-mode" id="angleModeWrap" style="display: none;">
              <button id="degRadBtn" class="mini-chip">DEG</button>
            </div>
          </div>

          <div class="display-box">
            <div id="calcExpression" class="calc-expression"></div>
            <div class="calc-result-row">
              <div id="calcDisplay" class="calc-display">0</div>
              <button id="copyCalcResult" class="copy-btn" title="결과 복사">복사</button>
            </div>
          </div>

          <!-- 공학용 키패드 (토글 시 표시) -->
          <div id="sciKeypad" class="sci-grid" style="display: none;">
            <button class="key sci" data-sci="sin">sin</button>
            <button class="key sci" data-sci="cos">cos</button>
            <button class="key sci" data-sci="tan">tan</button>
            <button class="key sci" data-sci="sqrt">√x</button>
            <button class="key sci" data-sci="sq">x²</button>
            <button class="key sci" data-sci="pow">xʸ</button>
            <button class="key sci" data-sci="log">log</button>
            <button class="key sci" data-sci="ln">ln</button>
            <button class="key sci" data-sci="pi">π</button>
            <button class="key sci" data-sci="e">e</button>
            <button class="key sci" data-sci="inv">1/x</button>
            <button class="key sci" data-sci="fact">n!</button>
          </div>

          <!-- 기본 키패드 -->
          <div class="calc-grid">
            <button class="key util" data-action="clear">AC</button>
            <button class="key util" data-action="backspace">⌫</button>
            <button class="key util" data-action="paren">( )</button>
            <button class="key op" data-val="/">÷</button>

            <button class="key num" data-val="7">7</button>
            <button class="key num" data-val="8">8</button>
            <button class="key num" data-val="9">9</button>
            <button class="key op" data-val="*">×</button>

            <button class="key num" data-val="4">4</button>
            <button class="key num" data-val="5">5</button>
            <button class="key num" data-val="6">6</button>
            <button class="key op" data-val="-">−</button>

            <button class="key num" data-val="1">1</button>
            <button class="key num" data-val="2">2</button>
            <button class="key num" data-val="3">3</button>
            <button class="key op" data-val="+">+</button>

            <button class="key util" data-action="sign">±</button>
            <button class="key num" data-val="0">0</button>
            <button class="key num" data-val=".">.</button>
            <button class="key eq" data-action="equals">=</button>
          </div>
          <div class="calc-extra-row">
            <button class="key util-wide" data-action="percent">% (백분율)</button>
            <button class="key util-wide" data-val="00">00</button>
            <button class="key util-wide" data-val="000">000</button>
          </div>
        </section>

        <!-- 계산 기록 사이드바 -->
        <aside class="calc-history">
          <div class="history-header">
            <h3>계산 기록</h3>
            <button id="clearHistoryBtn" class="text-btn">전체 삭제</button>
          </div>
          <ul id="historyList" class="history-list">
            <li class="empty-msg">아직 계산 기록이 없습니다.</li>
          </ul>
        </aside>
      </div>
    </main>

    <!-- 2. 실시간 환율 탭 -->
    <main id="tab-currency" class="tab-panel">
      <div class="currency-header-card">
        <div class="status-info">
          <span id="rateStatusBadge" class="badge loading">환율 불러오는 중...</span>
          <span id="rateUpdateTime" class="update-time">기준 시간 확인 중</span>
        </div>
        <button id="refreshRatesBtn" class="secondary-btn">🔄 최신 환율 새로고침</button>
      </div>

      <div class="converter-card">
        <div class="currency-box">
          <label for="fromCurrency">보내는 통화 (기준)</label>
          <div class="input-select-group">
            <select id="fromCurrency"></select>
            <input type="number" id="fromCurrencyAmount" value="1" step="any" placeholder="금액 입력" />
          </div>
          <div id="fromCurrencySub" class="currency-sub-text"></div>
        </div>

        <div class="swap-container">
          <button id="swapCurrencyBtn" class="swap-btn" title="통화 맞바꾸기">⇅</button>
        </div>

        <div class="currency-box">
          <label for="toCurrency">받는 통화 (변환 결과)</label>
          <div class="input-select-group">
            <select id="toCurrency"></select>
            <input type="number" id="toCurrencyAmount" step="any" placeholder="변환 결과" />
          </div>
          <div id="toCurrencySub" class="currency-sub-text"></div>
        </div>
      </div>

      <!-- 빠른 금액 버튼 -->
      <div class="quick-amounts">
        <span class="quick-label">빠른 입력:</span>
        <button class="chip-btn" data-amt="1">1</button>
        <button class="chip-btn" data-amt="10">10</button>
        <button class="chip-btn" data-amt="100">100</button>
        <button class="chip-btn" data-amt="1000">1,000</button>
        <button class="chip-btn" data-amt="10000">10,000</button>
        <button class="chip-btn" data-amt="100000">100,000</button>
      </div>

      <div id="exchangeSummaryBar" class="summary-banner"></div>

      <!-- 주요 국가 환율 한눈에 보기 -->
      <div class="multi-rates-section">
        <div class="section-title-row">
          <h3>🌍 주요 통화 환율표 (원화 KRW 및 입력 금액 기준)</h3>
          <span class="hint-text">항목을 클릭하면 해당 통화로 바로 선택됩니다</span>
        </div>
        <div id="popularRatesGrid" class="rates-grid"></div>
      </div>
    </main>

    <!-- 3. 단위 변환 탭 -->
    <main id="tab-unit" class="tab-panel">
      <!-- 카테고리 선택 -->
      <div id="unitCategoryBar" class="category-chips">
        <button class="cat-chip active" data-cat="length">📏 길이</button>
        <button class="cat-chip" data-cat="weight">⚖️ 무게</button>
        <button class="cat-chip" data-cat="area">📐 넓이(평수)</button>
        <button class="cat-chip" data-cat="volume">🧪 부피</button>
        <button class="cat-chip" data-cat="temperature">🌡️ 온도</button>
        <button class="cat-chip" data-cat="data">💾 데이터</button>
        <button class="cat-chip" data-cat="speed">🚀 속도</button>
        <button class="cat-chip" data-cat="time">⏱️ 시간</button>
      </div>

      <div class="converter-card">
        <div class="currency-box">
          <label for="fromUnit">변환할 단위</label>
          <div class="input-select-group">
            <select id="fromUnit"></select>
            <input type="number" id="fromUnitValue" value="1" step="any" placeholder="값 입력" />
          </div>
        </div>

        <div class="swap-container">
          <button id="swapUnitBtn" class="swap-btn" title="단위 맞바꾸기">⇅</button>
        </div>

        <div class="currency-box">
          <label for="toUnit">변환 결과 단위</label>
          <div class="input-select-group">
            <select id="toUnit"></select>
            <input type="number" id="toUnitValue" step="any" placeholder="결과" />
          </div>
        </div>
      </div>

      <div id="unitFormulaBar" class="summary-banner"></div>

      <!-- 전체 단위 동시 변환 표 -->
      <div class="multi-rates-section">
        <div class="section-title-row">
          <h3>📊 전체 단위 한눈에 비교</h3>
          <span class="hint-text">클릭 시 결과 값을 클립보드에 복사합니다</span>
        </div>
        <div id="allUnitsGrid" class="units-grid"></div>
      </div>
    </main>

    <div id="toast" class="toast">복사되었습니다!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
